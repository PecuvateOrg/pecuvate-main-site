<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" font-family="Poppins, system-ui, sans-serif"><title>The question shifts from which tool to use to how to rethink the problem</title><style>.l{fill:none;stroke:#1A1A1A;stroke-width:2}.m{fill:none;stroke:#8A8A8A;stroke-width:1.5}.d{stroke-dasharray:5 5}.o{fill:none;stroke:#F47C20;stroke-width:2.5}.of{fill:#F47C20}.k{fill:#1A1A1A}.t{font-size:15px;fill:#1A1A1A}.s{font-size:13px;fill:#6B6B6B}.h{font-size:12px;letter-spacing:2px;fill:#8A8A8A}</style><rect width="800" height="360" fill="#FFFFFF"/>
<text x="60" y="56" class="h">THE OLD QUESTION</text><text x="460" y="56" class="h">THE NEW QUESTION</text>
<rect x="60" y="80" width="280" height="200" class="m d"/>
<rect x="110" y="150" width="70" height="70" class="l"/><text x="145" y="245" class="s" text-anchor="middle">problem</text>
<circle cx="270" cy="185" r="24" class="m"/><circle cx="270" cy="120" r="16" class="m"/><circle cx="270" cy="250" r="16" class="m"/>
<path class="m" d="M180 185h66M180 170l76-44M180 200l76 44"/><text x="200" y="300" class="s" text-anchor="middle">which tool?</text>
<path class="o" d="M372 180h56"/><path class="of" d="M436 180l-12-7v14z"/>
<rect x="460" y="80" width="280" height="200" class="l"/>
<path class="l" d="M500 220l60-80 60 50 60-90"/><circle cx="500" cy="220" r="6" class="of"/><circle cx="560" cy="140" r="6" class="of"/><circle cx="620" cy="190" r="6" class="of"/><circle cx="680" cy="100" r="6" class="of"/>
<text x="600" y="300" class="s" text-anchor="middle">rethink the problem itself</text>
<text x="200" y="330" class="t" text-anchor="middle">“What tool can we use?”</text><text x="600" y="330" class="t" text-anchor="middle">“How should we rethink it now?”</text>
</svg>
