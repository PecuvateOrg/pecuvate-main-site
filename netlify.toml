[build]
  base    = "src"
  command = "pnpm run build"
  publish = "dist"
  # Skip builds that cannot change the site, and never build PR/branch previews:
  # review locally with ops/lan-preview.sh. See ops/netlify-ignore.sh.
  ignore  = "bash ../ops/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
